<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<title>Aura Clock</title>
	
	<meta name="theme-color" content="#000000">

	<script src="https://cdn.tailwindcss.com"></script>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');

		/* AGGRESSIVE FULL-SCREEN BLACK FIX */
		html, body {
			margin: 0; 
			padding: 0; 
			border: 0;
			/* FORCED BLACK BACKGROUND */
			background-color: #000000 !important; 
			color: #fff;
			overflow: hidden;
			height: 100%; 
			width: 100%;
		}
		
		body {
			font-family: 'Inter', sans-serif;
			background-color: #000000;
			color: #fff;
			overflow: hidden;
			min-height: 100vh;
		}

		#clock-container {
			display: flex; justify-content: center; align-items: center;
			height: 100%; /* Use 100% of body height, which should be 100% viewport */
			width: 100%;
			transition: opacity 0.3s ease, filter 0.3s ease;
			background-color: #000000;
			/* Add padding using safe-area-inset to prevent content being hidden behind any remaining system bars */
			padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
		}

		#time-display {
			/* Adjusted CLAMP: Reduced max size to 10rem to prevent overflow when system bars are visible */
			font-size: clamp(3rem, 15vw, 10rem); 
			font-weight: 400; line-height: 1; letter-spacing: -0.05em;
			color: var(--clock-color, #618D61);
			transition: color 0.3s ease, text-shadow 0.3s ease;
			font-variant-numeric: tabular-nums;
			display: flex; align-items: flex-end;
			
			/* GLOW EFFECT CONTROLLED BY JS */
			text-shadow: var(--glow-filter, none);
		}

		#colon-separator {
			padding-right: 0.1em;
		}

		#seconds {
			font-size: 70%;
			margin-left: 0.1em;
		}

		/* Settings button (Gear Icon): Moved down slightly to clear potential top bars/notches */
		#settings-button {
			position: absolute; top: 2rem; right: 1rem;
			transition: opacity 0.5s ease-out;
			cursor: pointer; 
			z-index: 60; 
		}

		/* The main overlay element */
		#settings-overlay {
			position: fixed; top: 0; left: 0; right: 0; bottom: 0;
			background-color: rgba(0, 0, 0, 0.85);
			z-index: 40; 
		}

		/* The panel wrapper that positions the card */
		#settings-panel {
			width: 100%; height: 100%;
			display: flex; justify-content: center; align-items: flex-start;
			padding-top: 2rem; overflow-y: auto;
		}

		.setting-card {
			max-width: 400px; width: 90%;
			background-color: #1a1a1a; margin-bottom: 2rem;
		}

		.color-swatch {
			width: 40px; height: 40px; border-radius: 50%;
			cursor: pointer; border: 3px solid transparent;
			transition: border-color 0.15s;
		}
		.color-swatch.selected {
			border-color: #fff; box-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
		}

		/* --- ALIGNED INPUT STYLES FIX --- */

		.aligned-input {
			background-color: #333; color: #fff; padding: 8px;
			border-radius: 6px; border: 1px solid #444; font-size: 1rem;
			font-family: 'Inter', sans-serif;
			height: 40px; /* Standardize height for visual block */
			box-sizing: border-box;
		}
		
		/* Time Input */
		#chime-time-input {
			width: 130px; 
			text-align: center;
		}
		
		/* Melody Dropdown */
		#melody-select {
			width: 130px; 
			text-align: center;
			-webkit-appearance: none; 
			-moz-appearance: none;    
			appearance: none;         
			background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%20viewBox%3D%220%200%20292.4%20292.4%22%3E%3Cpath%20fill%3D%22white%22%20d%3D%22M287%20197.3l-133.4-133.4c-4.8-4.8-12.5-4.8-17.3%200L5.3%20197.3c-4.8%204.8-4.8%2012.5%200%2017.3s12.5%204.8%2017.3%200l118.4-118.4%20118.4%20118.4c4.8%204.8%2012.5%204.8%2017.3%200s4.8-12.5%200-17.3z%22%2F%3E%3C%2Fsvg%3E');
			background-repeat: no-repeat;
			background-position: right 8px center;
			background-size: 10px;
			padding-right: 25px; 
		}
		
		/* Timer Selectors Wrapper */
		#timer-select-wrapper {
			display: flex;
			align-items: center;
			justify-content: center;
			width: 130px; 
			padding: 0; 
			border: none;
		}
		
		/* Timer Select Elements */
		#timer-minutes-select, #timer-seconds-select {
			background-color: #333; 
			color: #fff; 
			border: 1px solid #444; 
			font-size: 1rem;
			font-family: 'Inter', sans-serif;
			height: 40px;
			padding: 0 4px; 
			
			-webkit-appearance: none;
			-moz-appearance: none;    
			appearance: none;         
			background-repeat: no-repeat;
			background-position: right 8px center;
			background-size: 8px; 
			text-align: center;
		}

		#timer-minutes-select {
			width: 65px; 
			border-right: none;
			border-radius: 6px 0 0 6px;
			padding-right: 20px;
		}
		#timer-seconds-select {
			width: 65px; 
			border-radius: 0 6px 6px 0;
			padding-right: 20px;
		}
		
		/* Colon separator between minute/second selectors */
		#timer-select-wrapper > span {
			position: absolute; 
			z-index: 10;
			pointer-events: none; 
			color: #fff; 
			background-color: #333;
			height: 40px; 
			display: flex;
			align-items: center;
			font-size: 1.25rem;
			line-height: 1;
		}

		/* Start/Stop button size */
		#timer-start-stop-button {
			width: 60px; 
			height: 38px; 
			font-weight: bold;
			border-radius: 0.375rem;
			transition: background-color 0.2s, transform 0.1s;
			padding: 0; 
			font-size: 0.875rem; 
		}
		.start-state {
			background-color: #22c55e;
			color: white;
		}
		.stop-state {
			background-color: #ef4444;
			color: white;
		}
		/* --- END ALIGNED INPUT STYLES FIX --- */

		input[type="time"]::-webkit-calendar-picker-indicator {
			filter: invert(1);
		}

		/* General UI styles (Unchanged) */
		.alarm-flashing {
			animation: alarmFlash 1s infinite alternate;
		}
		@keyframes alarmFlash {
			from { opacity: 1; }
			to { opacity: 0.2; }
		}
		.feature-title {
			font-size: 1.125rem; font-weight: 600; color: #fff;
			padding-bottom: 0.5rem; margin-bottom: 0.5rem;
			border-bottom: 1px solid #374151;
		}
		.setting-group {
			margin-bottom: 1.5rem;
		}
		.toggle-group {
			border: 1px solid #374151;
			border-radius: 0.5rem;
			margin-bottom: 1.5rem;
		}
		.toggle-group > label {
			background-color: #1a1a1a;
		}
		.toggle-group > label:not(:last-child) {
			border-bottom: 1px solid #374151;
		}
		.toggle-group > label:first-child {
			border-radius: 0.5rem 0.5rem 0 0;
		}
		.toggle-group > label:last-child {
			border-radius: 0 0 0.5rem 0.5rem;
		}
		.toggle-group > label:only-child {
			border-radius: 0.5rem;
		}
		#settings-close-card-button {
			background: none; border: none; padding: 0;
			color: #9CA3AF; cursor: pointer; transition: color 0.2s;
		}
		#settings-close-card-button:hover {
			color: #fff;
		}
	</style>
</head>
<body>

<div id="clock-container">
	<div id="time-display">
		<span id="hours-display"></span>
		<span id="colon-separator">:</span>
		<span id="minutes-display"></span>
		<span id="seconds"></span>
	</div>
</div>


<button id="settings-button" class="opacity-100 w-12 h-12 flex items-center justify-center bg-gray-900 bg-opacity-50 text-white rounded-full shadow-lg hover:bg-opacity-70 transition-all duration-300">
	<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings">
		<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 0 2.72l-.15.1a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1 0-2.71l.15-.11a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
		<circle cx="12" cy="12" r="3"/>
	</svg>
</button>

<div id="settings-overlay" style="display: none;">
	<div id="settings-panel" onclick="toggleSettingsPanel(false)">
		<div class="setting-card rounded-xl p-6 shadow-2xl space-y-4" onclick="event.stopPropagation()">

			<div class="setting-group pt-0">
				<div class="flex items-center justify-between border-b border-gray-700 mb-2 pb-2">
					<h3 class="feature-title border-none mb-0 pb-0">Clock Color</h3>
					
					<button id="settings-close-card-button" onclick="toggleSettingsPanel(false)">
						<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x">
							<path d="M18 6 6 18"/><path d="m6 6 12 12"/>
						</svg>
					</button>
				</div>
				<div id="color-selector" class="flex space-x-3">
					</div>
			</div>

			<div class="setting-group">
				<h3 class="feature-title">Brightness</h3>
				<input type="range" id="brightness-slider" min="0.1" max="2.0" step="0.01" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer range-lg">
			</div>

			<div class="setting-group">
				<h3 class="feature-title">Display Options</h3>

				<div class="toggle-group">
					<label for="format-toggle" class="flex items-center justify-between p-3 cursor-pointer">
						<span class="text-white">12 Hour</span>
						<div class="relative inline-flex items-center">
							<input type="checkbox" id="format-toggle" onchange="toggleTimeFormat(this.checked)" class="sr-only peer">
							<div class="w-11 h-6 bg-gray-600 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-800 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
						</div>
					</label>
					<label for="seconds-toggle" class="flex items-center justify-between p-3 cursor-pointer">
						<span class="text-white">Show Seconds</span>
						<div class="relative inline-flex items-center">
							<input type="checkbox" id="seconds-toggle" onchange="toggleSeconds(this.checked)" checked class="sr-only peer">
							<div class="w-11 h-6 bg-gray-600 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-800 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
						</div>
					</label>
					<label for="aura-toggle" class="flex items-center justify-between p-3 cursor-pointer">
						<span class="text-white">Aura Effect</span>
						<div class="relative inline-flex items-center">
							<input type="checkbox" id="aura-toggle" onchange="toggleAura(this.checked)" class="sr-only peer">
							<div class="w-11 h-6 bg-gray-600 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-800 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
						</div>
					</label>
					</div>
			</div>
			<div class="setting-group">
				<div class="toggle-group">
					<label for="keep-awake-toggle" class="flex items-center justify-between p-3 cursor-pointer">
						<span class="text-white">Keep Screen Awake</span>
						<div class="relative inline-flex items-center">
							<input type="checkbox" id="keep-awake-toggle" onchange="toggleKeepAwake(this.checked)" class="sr-only peer">
							<div class="w-11 h-6 bg-gray-600 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-800 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
						</div>
					</label>
					</div>
			</div>
			<div class="space-y-4 pt-4">
				<h3 class="feature-title">Chime Reminder</h3> 

				<div class="flex items-center justify-between p-3 bg-gray-800 rounded-t-lg border-b border-gray-700">
					<span class="text-white">Time</span> 
					<div class="flex items-center space-x-4 gap-2"> 
						<input type="time" id="chime-time-input" value="08:00" class="aligned-input">
						<label for="chime-toggle" class="relative inline-flex items-center cursor-pointer">
							<input type="checkbox" id="chime-toggle" class="sr-only peer">
							<div class="w-11 h-6 bg-gray-600 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-800 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
						</label>
					</div>
				</div>
				<div class="flex items-center justify-between p-3 bg-gray-800 border-b border-gray-700">
					<span class="text-white">Timer</span> 
					<div class="flex items-center space-x-4 gap-2"> 
						<div id="timer-select-wrapper" class="aligned-input">
							<select id="timer-minutes-select" onchange="updateTimerDuration()" class="focus:border-blue-500"></select>
							<span class="text-lg px-1 pointer-events-none">:</span>
							<select id="timer-seconds-select" onchange="updateTimerDuration()" class="focus:border-blue-500"></select>
						</div>
						<button id="timer-start-stop-button" class="start-state">Start</button>
					</div>
				</div>
				<div class="flex items-center justify-between p-3 bg-gray-800 rounded-b-lg">
					<span class="text-white">Melody</span> 
					<div class="flex items-center space-x-4 gap-2"> 
						<select id="melody-select" class="aligned-input">
							<option value="beep">Woosh</option>
							<option value="melody1">Clock</option>
							<option value="melody2">Bell</option>
							<option value="melody3">Ancient3</option>
							<option value="melody4">Flute</option>
							<option value="melody5">Tick-tock</option>
							<option value="melody6">Tunnel</option>
						</select>
						<div class="w-[60px] h-[38px]"></div> 
					</div>
				</div>
				</div>
			</div>
	</div>
</div>

<audio id="chime-audio" src="beep.wav" preload="auto"></audio>
<audio id="background-audio" src="silent.mp3" loop preload="auto"></audio>

<script>
	// --- ELEMENT REFERENCES ---
	const clockContainer = document.getElementById('clock-container');
	const hoursDisplay = document.getElementById('hours-display');
	const minutesDisplay = document.getElementById('minutes-display');
	const colonSeparator = document.getElementById('colon-separator');
	const secondsDisplay = document.getElementById('seconds');
	const settingsButton = document.getElementById('settings-button');
	const settingsOverlay = document.getElementById('settings-overlay');
	const settingsPanel = document.getElementById('settings-panel'); 
	const brightnessSlider = document.getElementById('brightness-slider');
	const colorSelector = document.getElementById('color-selector');
	const secondsToggle = document.getElementById('seconds-toggle');
	const formatToggle = document.getElementById('format-toggle');
	const keepAwakeToggle = document.getElementById('keep-awake-toggle');
	const auraToggle = document.getElementById('aura-toggle');
	const chimeTimeInput = document.getElementById('chime-time-input');
	const chimeToggle = document.getElementById('chime-toggle');
	// Timer elements
	const timerMinutesSelect = document.getElementById('timer-minutes-select');
	const timerSecondsSelect = document.getElementById('timer-seconds-select');
	const timerStartStopButton = document.getElementById('timer-start-stop-button'); 
	// Melody element
	const melodySelect = document.getElementById('melody-select');
	
	const CHIME_AUDIO = document.getElementById('chime-audio');
	const BACKGROUND_AUDIO = document.getElementById('background-audio');

	let wakeLockSentinel = null;

	// --- CONFIGURATION & STATE ---
	const CLOCK_COLORS = {
		'Lime': '#618D61', 'Blue': '#4F59A3', 'Yellow': '#968D5D',
		'Red': '#B3645F', 'Light Grey': '#A9A9A9'
	};
	
	const GLOW_PALETTE = {
		'Lime': '#96A0E0', 		
		'Yellow': '#B9D968', 	
		'Blue': '#F0F0F0', 		
		'Red': '#FFD700', 		
		'Light Grey': '#E09A96',
		'Default': '#FFFFFF' 
	};

	let userState = {
		brightness: 1.0, colorName: 'Lime', is12HourFormat: false,
		showSeconds: true, chimeTime: '08:00',
		isChimeOn: false, isKeptAwake: false, lastChimeTimestamp: 0,
		isAuraOn: false,
		// Timer State
		timerMinutes: 5, 		 // The stored *duration* minutes
		timerSeconds: 0, 		 // The stored *duration* seconds
		isTimerRunning: false, 
		timerTimeRemaining: 300, // Total seconds left in the countdown (5 minutes default)
		currentMelody: 'beep' 
	};
	
	// --- INTERVALS ---
	let activityTimeout;
	let isPanelOpen = false;
	let chimeTriggered = false;
	let flashTimeoutId = null;
	let timerInterval = null; 

	// ==========================================
	// --- CLOCK & DISPLAY LOGIC ---
	// ==========================================

	function updateTime() {
		const now = new Date();
		const hours24 = now.getHours();
		const minutes = String(now.getMinutes()).padStart(2, '0');
		const seconds = now.getSeconds();

		let hours = hours24;

		if (userState.is12HourFormat) {
			hours = hours % 12;
			hours = hours ? hours : 12;
			hoursDisplay.textContent = String(hours);
		} else {
			// LOGIC CORRECTION: Display 24-hour time with leading zero (00-23)
			hoursDisplay.textContent = String(hours).padStart(2, '0');
		}

		minutesDisplay.textContent = minutes;
		secondsDisplay.textContent = String(seconds).padStart(2, '0');

		// BLINK LOGIC
		if (!userState.showSeconds) {
			colonSeparator.style.visibility = (seconds % 2 === 0) ? 'visible' : 'hidden';
		} else {
			colonSeparator.style.visibility = 'visible';
		}

		checkChime(now, hours24, minutes, seconds);
	}
	
	function toggleSeconds(show) {
		userState.showSeconds = show;
		document.getElementById('seconds').style.display = show ? 'inline-block' : 'none';
		localStorage.setItem('showSeconds', show);
		updateTime();
	}

	function toggleTimeFormat(is12Hour) {
		userState.is12HourFormat = is12Hour;
		localStorage.setItem('is12HourFormat', is12Hour);
		updateTime();
	}
	
	function toggleAura(isOn) {
		userState.isAuraOn = isOn;
		localStorage.setItem('isAuraOn', isOn);
		applyStyles();
	}


	// ==========================================
	// --- STYLES & BRIGHTNESS LOGIC ---
	// ==========================================
	
	function applyStyles() {
		const brightnessValue = userState.brightness;
		clockContainer.style.filter = `brightness(${brightnessValue})`;
		document.documentElement.style.setProperty('--clock-brightness', brightnessValue);

		const colorValue = CLOCK_COLORS[userState.colorName];
		document.documentElement.style.setProperty('--clock-color', colorValue);

		if (userState.isAuraOn) {
			const glowColor = GLOW_PALETTE[userState.colorName] || GLOW_PALETTE['Default']; 
			
			const shadow = `0 0 10px rgba(255, 255, 255, 0.3), 0 0 15px ${glowColor}`; 
			document.getElementById('time-display').style.textShadow = shadow;
		} else {
			document.getElementById('time-display').style.textShadow = 'none';
		}


		document.querySelectorAll('.color-swatch').forEach(swatch => {
			if (swatch.dataset.colorName === userState.colorName) {
				swatch.classList.add('selected');
			} else {
				swatch.classList.remove('selected');
			}
		});
	}

	function handleColorChange(name) {
		userState.colorName = name;
		localStorage.setItem('clockColorName', name);
		applyStyles(); 
	}

	function handleBrightnessChange(event) {
		userState.brightness = parseFloat(event.target.value);
		localStorage.setItem('clockBrightness', userState.brightness);
		applyStyles();
	}

	function initColorSwatches() {
		colorSelector.innerHTML = '';
		Object.entries(CLOCK_COLORS).forEach(([name, hex]) => {
			const swatch = document.createElement('div');
			swatch.className = 'color-swatch shadow-md';
			swatch.style.backgroundColor = hex;
			swatch.dataset.colorName = name;
			swatch.onclick = () => handleColorChange(name);
			colorSelector.appendChild(swatch);
		});

		brightnessSlider.value = userState.brightness;
		applyStyles();
	}

	// ==========================================
	// --- CHIME & MELODY LOGIC ---
	// ==========================================
	
	function getMelodyFile(melody) {
    		    switch(melody) {
        		case 'melody1': return 'clock.mp3';
        		case 'melody2': return 'bell.mp3';
			case 'melody3': return 'ancient3.mp3';
			case 'melody4': return 'flute.wav';
			case 'melody5': return 'tick-tock.wav';
			case 'melody6': return 'tunnel.wav';
        		case 'beep':
        	default: return 'beep.wav';
    		}
	}

	function checkChime(now, hours24, minutes, seconds) {
		if (!userState.isChimeOn) return;

		const chimeHour = userState.chimeTime.substring(0, 2);
		const chimeMinute = userState.chimeTime.substring(3, 5);

		const currentHourString = String(hours24).padStart(2, '0');
		const currentMinuteString = minutes; 

		if (currentHourString === chimeHour && currentMinuteString === chimeMinute) {
			if (seconds >= 0 && seconds <= 1 && !chimeTriggered) {
				triggerChime(now);
				chimeTriggered = true;
				setTimeout(() => { chimeTriggered = false; }, 60000); 
			}
		} else {
			if (chimeTriggered) {
				chimeTriggered = false;
			}
		}
	}

	function triggerChime(now) {
		userState.lastChimeTimestamp = now.getTime();
		localStorage.setItem('lastChimeTimestamp', userState.lastChimeTimestamp);
		
		CHIME_AUDIO.src = getMelodyFile(userState.currentMelody);
		CHIME_AUDIO.volume = 0.2;
		CHIME_AUDIO.currentTime = 0; 
		CHIME_AUDIO.play().catch(e => {
			console.warn("Chime Audio Playback failed (Interaction may be required):", e);
		});

		clockContainer.classList.add('alarm-flashing');
		document.addEventListener('click', dismissChime, { once: true });
		flashTimeoutId = setTimeout(dismissChime, 30000); 
	}
	
	function triggerTimerEnd() {
		// Stop the timer first
		stopTimer();
		
		// Play the melody
		CHIME_AUDIO.src = getMelodyFile(userState.currentMelody);
		CHIME_AUDIO.volume = 0.5; // Louder for timer
		CHIME_AUDIO.currentTime = 0;
		CHIME_AUDIO.play().catch(e => {
			console.warn("Timer Audio Playback failed (Interaction may be required):", e);
		});
		
		// Visual feedback (Flashing)
		clockContainer.classList.add('alarm-flashing');
		document.addEventListener('click', dismissChime, { once: true });
		flashTimeoutId = setTimeout(dismissChime, 30000);
	}

	function dismissChime() {
		if (!clockContainer.classList.contains('alarm-flashing')) return;
		if (flashTimeoutId) {
			clearTimeout(flashTimeoutId);
			flashTimeoutId = null;
		}
		clockContainer.classList.remove('alarm-flashing');
		document.removeEventListener('click', dismissChime, { once: true });
	}

	function updateChimeStatus() {
		localStorage.setItem('isChimeOn', userState.isChimeOn);
		localStorage.setItem('chimeTime', userState.chimeTime);
	}
	
	function handleMelodyChange(melody) {
		userState.currentMelody = melody;
		localStorage.setItem('currentMelody', melody);
		CHIME_AUDIO.src = getMelodyFile(melody);
		CHIME_AUDIO.load();
	}


	// ==========================================
	// --- TIMER LOGIC ---
	// ==========================================

	function populateTimerSelectors() {
		// Populate Minutes (00 to 99)
		for (let i = 0; i <= 99; i++) {
			const value = String(i).padStart(2, '0');
			timerMinutesSelect.add(new Option(value, i));
		}
		
		// Populate Seconds (00 to 59)
		for (let i = 0; i <= 59; i++) {
			const value = String(i).padStart(2, '0');
			timerSecondsSelect.add(new Option(value, i));
		}
	}
	
	function updateTimerDuration() {
		// Only update duration if the timer is STOPPED
		if (userState.isTimerRunning) return;
		
		const m = parseInt(timerMinutesSelect.value) || 0;
		const s = parseInt(timerSecondsSelect.value) || 0;

		userState.timerMinutes = m;
		userState.timerSeconds = s;
		
		// Also update the total remaining time to match the new duration
		userState.timerTimeRemaining = (m * 60) + s;

		localStorage.setItem('timerMinutes', userState.timerMinutes);
		localStorage.setItem('timerSeconds', userState.timerSeconds);
		localStorage.setItem('timerTimeRemaining', userState.timerTimeRemaining);
	}

	function updateTimerDisplay() {
		// Calculate Minutes and Seconds for display
		const totalSeconds = userState.isTimerRunning 
			? userState.timerTimeRemaining
			: (userState.timerMinutes * 60) + userState.timerSeconds;

		const m = Math.floor(totalSeconds / 60);
		const s = totalSeconds % 60;
			
		// Update the select boxes to show the current time (remaining or set duration)
		timerMinutesSelect.value = String(m);
		timerSecondsSelect.value = String(s);

		// Update the button text and state
		if (userState.isTimerRunning) {
			timerStartStopButton.textContent = 'Stop';
			timerStartStopButton.classList.remove('start-state');
			timerStartStopButton.classList.add('stop-state');
			timerMinutesSelect.disabled = true;
			timerSecondsSelect.disabled = true;
		} else {
			timerStartStopButton.textContent = 'Start'; 
			timerStartStopButton.classList.remove('stop-state');
			timerStartStopButton.classList.add('start-state');
			// Re-enable input only if the settings panel is open
			if(isPanelOpen) {
				timerMinutesSelect.disabled = false;
				timerSecondsSelect.disabled = false;
			}
		}
	}
	
	function checkTimer() {
		if (!userState.isTimerRunning) {
			stopTimer();
			return;
		}
		
		if (userState.timerTimeRemaining <= 0) {
			triggerTimerEnd();
			return;
		}
		
		userState.timerTimeRemaining--;
		localStorage.setItem('timerTimeRemaining', userState.timerTimeRemaining);
		
		// Update the UI every second to show the countdown
		updateTimerDisplay(); 
	}
	
	function startTimer() {
		// 1. Check if duration is zero before starting
		if (userState.timerTimeRemaining <= 0) {
			alert("Please set a timer duration greater than zero.");
			return;
		}
		
		// 2. Set state
		userState.isTimerRunning = true;
		localStorage.setItem('isTimerRunning', true);
		
		// 3. Ensure the display reflects the running timer immediately
		updateTimerDisplay();
		
		// 4. Start the interval (will call checkTimer every second)
		if (timerInterval === null) {
			timerInterval = setInterval(checkTimer, 1000);
		}
		
		// Timer starts, but we keep the settings panel open as requested.
	}
	
	function stopTimer() {
		if (timerInterval) {
			clearInterval(timerInterval);
			timerInterval = null;
		}
		
		userState.isTimerRunning = false;
		localStorage.setItem('isTimerRunning', false);
		
		// Reset remaining time to the stored duration (the time the user set)
		userState.timerTimeRemaining = (userState.timerMinutes * 60) + userState.timerSeconds;
		localStorage.setItem('timerTimeRemaining', userState.timerTimeRemaining);
		
		// Update UI to show the duration and the 'Start' button
		updateTimerDisplay(); 
	}
	
	function handleTimerButton(event) {
		// CRITICAL FIX: Explicitly stop the click event from reaching the overlay.
		if (event) {
			event.stopPropagation();
		}
		
		if (userState.isTimerRunning) {
			stopTimer();
		} else {
			startTimer();
		}
	}


	// ==========================================
	// --- DEVICE CONTROLS ---
	// ==========================================

	// This function must be tied to a user gesture (like a click) to work reliably.
	function startBackgroundAudioHack() {
		BACKGROUND_AUDIO.volume = 0.001; 
		BACKGROUND_AUDIO.play().catch(e => {
			console.warn("Background audio hack play failed. User interaction is required for Keep Awake feature.");
		});
	}

	function stopBackgroundAudioHack() {
		BACKGROUND_AUDIO.pause();
		BACKGROUND_AUDIO.currentTime = 0;
	}

	async function toggleKeepAwake(isOn) {
		userState.isKeptAwake = isOn;
		localStorage.setItem('isKeptAwake', isOn);

		if (isOn) {
			try {
				if ('wakeLock' in navigator) {
					wakeLockSentinel = await navigator.wakeLock.request('screen');
				} else if (window.Capacitor && window.Capacitor.isPluginAvailable('KeepAwake')) {
					await window.Capacitor.Plugins.KeepAwake.keepAwake();
				} else {
					console.warn("Screen Awake API not supported.");
				}
			} catch (e) {
				console.error("Keep Awake Error:", e);
				userState.isKeptAwake = false;
				keepAwakeToggle.checked = false;
			}
			// LOGIC CORRECTION: Removed redundant call to startBackgroundAudioHack here,
			// it should rely on the explicit user click in setupEventListeners.
		} else {
			if (wakeLockSentinel) {
				await wakeLockSentinel.release();
				wakeLockSentinel = null;
			} else if (window.Capacitor && window.Capacitor.isPluginAvailable('KeepAwake')) {
				await window.Capacitor.Plugins.KeepAwake.allowSleep();
			}
			stopBackgroundAudioHack();
		}
	}

	function setupKeepAwake() {
		const isWebAwakeSupported = 'wakeLock' in navigator;

		if (userState.isKeptAwake) {
			// This attempts to acquire the wakelock on load from a previous session
			// and handles fallback, but it might fail without a user gesture.
			toggleKeepAwake(true); 
		}

		document.addEventListener('visibilitychange', async () => {
			if (document.visibilityState === 'visible') {
				dismissChime(); 
				
				if (userState.isKeptAwake && !wakeLockSentinel && isWebAwakeSupported) {
					// Re-request the web wakelock if we regain visibility
					await toggleKeepAwake(true);
				}
				if (userState.isKeptAwake) {
					// Restart background audio hack if visibility changes
					startBackgroundAudioHack(); 
				}
			}
		});
	}

	async function setImmersiveMode() {
		if (window.Capacitor && window.Capacitor.isPluginAvailable('StatusBar')) {
			const StatusBar = window.Capacitor.Plugins.StatusBar;
			const NavigationBar = window.Capacitor.Plugins.NavigationBar;
			
			// Attempt to hide and force black status bar (top bar)
			try {
				await StatusBar.hide(); 
				await StatusBar.setStyle({ style: 'DARK' });
				await StatusBar.setBackgroundColor({ color: '#000000' });
			} catch (e) {
				console.warn("StatusBar control failed, falling back to CSS.");
			}
			
			// Attempt to hide and force black navigation bar (bottom bar on Android)
			try {
				await NavigationBar.hide(); 
				await NavigationBar.setTransparency({ isTransparent: false });
				await NavigationBar.setColor({ color: '#000000' });
			} catch (e) {
				console.warn("NavigationBar control failed, falling back to CSS.");
			}
		}
	}
	// ==========================================
	// --- SETTINGS PANEL & ACTIVITY LOGIC ---
	// ==========================================
	
	function toggleSettingsPanel(show) {
		if (typeof show === 'undefined') {
			show = !isPanelOpen; 
		}
		
		isPanelOpen = show;
		settingsOverlay.style.display = show ? 'block' : 'none';

		// When opening, disable input if the timer is running
		if (show) {
			if (userState.isTimerRunning) {
				timerMinutesSelect.disabled = true;
				timerSecondsSelect.disabled = true;
			}
			clearTimeout(activityTimeout);
			// Hide the external gear button when the panel is open
			settingsButton.style.display = 'none'; 
		} else {
			// When closing, re-enable input if the timer is stopped
			if (!userState.isTimerRunning) {
				timerMinutesSelect.disabled = false;
				timerSecondsSelect.disabled = false;
			}
			// Show the external gear button when the panel is closed
			settingsButton.style.display = 'flex';
			resetActivityTimer();
		}
	}

	function resetActivityTimer() {
		if (isPanelOpen) return;
		
		// If the button is currently hidden, show it now
		settingsButton.classList.remove('opacity-0');
		settingsButton.classList.add('opacity-100');

		clearTimeout(activityTimeout);

		activityTimeout = setTimeout(() => {
			settingsButton.classList.remove('opacity-100');
			settingsButton.classList.add('opacity-0');
		}, 4000);
	}

	// ==========================================
	// --- INITIALIZATION ---
	// ==========================================

	function loadSettings() {
		userState.brightness = parseFloat(localStorage.getItem('clockBrightness')) || 1.0;
		userState.colorName = localStorage.getItem('clockColorName') || 'Lime';
		userState.is12HourFormat = localStorage.getItem('is12HourFormat') === 'true';
		userState.showSeconds = localStorage.getItem('showSeconds') !== 'false';
		userState.chimeTime = localStorage.getItem('chimeTime') || '08:00';
		userState.isChimeOn = localStorage.getItem('isChimeOn') === 'true';
		userState.isKeptAwake = localStorage.getItem('isKeptAwake') === 'true';
		userState.lastChimeTimestamp = parseInt(localStorage.getItem('lastChimeTimestamp')) || 0;
		userState.isAuraOn = localStorage.getItem('isAuraOn') === 'true';
		userState.currentMelody = localStorage.getItem('currentMelody') || 'beep';
		
		// Load Timer State
		userState.timerMinutes = parseInt(localStorage.getItem('timerMinutes')) || 5;
		userState.timerSeconds = parseInt(localStorage.getItem('timerSeconds')) || 0;
		
		const wasRunning = localStorage.getItem('isTimerRunning') === 'true';
		const remaining = parseInt(localStorage.getItem('timerTimeRemaining'));
		
		if (wasRunning && remaining > 0) {
			userState.isTimerRunning = true;
			userState.timerTimeRemaining = remaining;
		} else {
			userState.isTimerRunning = false;
			// If not running or no remaining time, use the stored duration
			userState.timerTimeRemaining = (userState.timerMinutes * 60) + userState.timerSeconds;
		}
	}

	function applyInitialSettingsToUI() {
		formatToggle.checked = userState.is12HourFormat;
		secondsToggle.checked = userState.showSeconds;
		chimeTimeInput.value = userState.chimeTime;
		chimeToggle.checked = userState.isChimeOn;
		keepAwakeToggle.checked = userState.isKeptAwake;
		auraToggle.checked = userState.isAuraOn;
		
		// 1. Populate selectors first
		populateTimerSelectors(); 
		
		// 2. Set the melody value
		melodySelect.value = userState.currentMelody;
		
		// 3. Apply general styles and toggles
		applyStyles();
		toggleSeconds(userState.showSeconds);
		handleMelodyChange(userState.currentMelody);
		
		// 4. Handle persistent timer state (Display must be called first)
		if (userState.isTimerRunning) {
			// If timer was running, display the remaining time and restart the interval
			updateTimerDisplay(); 
			startTimer();
		} else {
			// If stopped, display the stored duration
			updateTimerDisplay(); 
		}
	}

	function setupEventListeners() {
		settingsButton.addEventListener('click', () => toggleSettingsPanel(true)); 
		brightnessSlider.addEventListener('input', handleBrightnessChange);
		
		// Chime Listeners
		chimeTimeInput.addEventListener('change', (e) => { userState.chimeTime = e.target.value; updateChimeStatus(); });
		chimeToggle.addEventListener('change', (e) => { userState.isChimeOn = e.target.checked; updateChimeStatus(); });
		
		// Timer Listeners (Handle Start/Stop Button and Duration change)
		timerStartStopButton.addEventListener('click', handleTimerButton); 
		timerMinutesSelect.addEventListener('change', updateTimerDuration);
		timerSecondsSelect.addEventListener('change', updateTimerDuration);
		
		// Melody Listener
		melodySelect.addEventListener('change', (e) => handleMelodyChange(e.target.value));

		document.addEventListener('mousemove', resetActivityTimer);
		document.addEventListener('touchstart', resetActivityTimer);
		document.addEventListener('keypress', resetActivityTimer);
		
		// LOGIC CORRECTION: Use the mandatory user interaction to attempt starting both the
		// background audio hack AND the official Keep Awake API if the toggle is set.
		document.body.addEventListener('click', async () => {
			startBackgroundAudioHack();
			if (userState.isKeptAwake && 'wakeLock' in navigator && !wakeLockSentinel) {
				await toggleKeepAwake(true);
			}
		}, { once: true });
	}

	// --- INITIALIZATION ENTRY POINT ---
	window.onload = function() {
		loadSettings();
		initColorSwatches();
		applyInitialSettingsToUI();
		setupEventListeners();
		setupKeepAwake();
		
		BACKGROUND_AUDIO.load();

		updateTime();
		setInterval(updateTime, 1000);

		// The function that runs the full-screen commands
		setImmersiveMode(); 

		// LOGIC CORRECTION: Removed the initial call to resetActivityTimer() to prevent the gear icon from flashing on load.
		// The button now starts visible (opacity-100 via HTML class) and will only start fading after the first user interaction.
	};
</script>
